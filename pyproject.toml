[project]
name = "dev-setup"
version = "0.1.0"
description = "FastAPI staj projesi baslangic sablonu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "fastapi",
    "uvicorn"
]

[project.scripts]
dev-setup = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov"

[tool.uv]
package = false
